<script>
  try {
    if (localStorage.getItem('matrix-theme') !== 'false') {
      document.documentElement.classList.add('matrix-mode');
    }
  } catch (_error) {
    document.documentElement.classList.add('matrix-mode');
  }

  try {
    const fontScale = sessionStorage.getItem('reader-font-scale');
    if (['0.9', '1', '1.1', '1.2', '1.3'].includes(fontScale)) {
      document.documentElement.style.setProperty('--reader-font-scale', fontScale);
    }

    const fontFamily = sessionStorage.getItem('reader-font-family');
    if (['default', 'serif', 'mono'].includes(fontFamily)) {
      document.documentElement.dataset.readerFont = fontFamily;
    }
  } catch (_error) {
    // The default reading settings remain available when storage is unavailable.
  }
</script>
<script defer src="{{ '/assets/js/matrix-theme.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/reading-controls.js' | relative_url }}"></script>
